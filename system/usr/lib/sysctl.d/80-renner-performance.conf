# renner.dev OS performance defaults (RO-5), mostly the SteamOS values.

# Games with many memory mappings (some crash without it).
vm.max_map_count = 2147483642
# Swap goes to compressed RAM (zram), which is cheap: use it before dropping
# file cache, and read it page by page.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Split locks: do not slow down programs that cause them (several games do).
kernel.split_lock_mitigate = 0
# No watchdog interrupts on a desktop.
kernel.nmi_watchdog = 0
