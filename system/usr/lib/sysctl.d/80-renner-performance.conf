# renner.dev OS performance defaults (RO-5). Values follow Bazzite and CachyOS
# (research 2026-11-08, sources in Pair Desk RO-5).

# Games with many memory mappings (some crash without it).
vm.max_map_count = 2147483642
# Swap goes to compressed RAM (zram): use it before dropping file cache, read
# it page by page, no watermark boosting.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Fixed write-back limits: no long stalls on machines with much RAM.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# Split locks: do not slow down programs that cause them (several games do).
kernel.split_lock_mitigate = 0
# No watchdog interrupts on a desktop.
kernel.nmi_watchdog = 0
